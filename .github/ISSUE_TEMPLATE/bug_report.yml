name: Bug report
description: Something in the interface or the library misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open the calculator
        2. Select ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Web application
        - Python library
        - Documentation
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: For the web application only.
      placeholder: Firefox 141, Windows 11
